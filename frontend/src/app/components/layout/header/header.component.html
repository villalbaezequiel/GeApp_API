<mat-toolbar color="primary">
  <!-- <span class="fill-remaining-space"></span> -->
  <span>GEAPP</span>
  <span class="fill-remaining-space"></span>
  <a mat-button routerLink="/tyc">Terminos y condiciones</a>
  @if (isAuthenticated()) {
    <a mat-button routerLink="/users">Usuarios</a>
  }
  @if (isAuthenticated()) {
    <a mat-button (click)="logout()">Salir</a>
  }
  @if (!isAuthenticated()) {
    <a mat-button routerLink="/auth/login">Ingresar</a>
  }
</mat-toolbar>
